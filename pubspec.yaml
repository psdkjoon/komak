name: komak
description: "psdk komak - learn small things, a little at a time."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_soloud: ^3.1.0
  vibration: ^3.1.3
  uuid: ^4.5.0
  csv: ^6.0.0
  http: ^1.2.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/app_icon_latte.svg
    - assets/icons/app_icon_mocha.svg
    - assets/sounds/tap.wav
    - assets/sounds/correct_1.wav
    - assets/sounds/correct_2.wav
    - assets/sounds/correct_3.wav
    - assets/sounds/correct_4.wav
    - assets/sounds/wrong_1.wav
    - assets/sounds/wrong_2.wav
    - assets/sounds/wrong_3.wav
    - assets/sounds/flip.wav
    - assets/sounds/success.wav
    - assets/sounds/whoosh.wav

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Bold.ttf
          weight: 700
